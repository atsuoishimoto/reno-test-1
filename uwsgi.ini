[uwsgi]
strict=true

###
# socket
###
if-env=USE_UWSGI_HTTP
http=0.0.0.0:8000
print = use http
endif=
if-not-env=USE_UWSGI_HTTP
socket = 0.0.0.0:8000
listen=25
print = use socket
endif=

###
# Module
###
chdir=/usr/src/app/reno_test_1/
module=reno_test_1.wsgi

###
# Performance
###
enable-threads=true
single-interpreter=true
py-call-uwsgi-fork-hooks=true
master=true
vacuum=true

processes=3
if-env=UWSGI_PROCESSES
processes=%(_)
endif=

threads=3
if-env=UWSGI_THREADS
threads=%(_)
endif=

reload-on-rss=128
if-env=UWSGI_RELOAD_ON_RSS
reload-on-rss=%(_)
endif=

evil-reload-on-rss=160
if-env=UWSGI_EVIL_RELOAD_ON_RSS
evil-reload-on-rss=%(_)
endif=

threads-stacksize=512
#max-requests=20000
post-buffering=8192
buffer-size=65536
reuse-port=true
thunder-lock=true

ignore-sigpipe=true
ignore-write-errors=true
disable-write-exception=true

###
# Harakiri
###
die-on-term=true
worker-reload-mercy=10
harakiri=60

###
# Log
###
logformat=time:%(ltime)	timestamp_us:%(tmicros)	remote_addr:%(addr)	x_forwarded_for:%(var.HTTP_X_FORWARDED_FOR)	x_forwarded_proto:%(var.HTTP_X_FORWARDED_PROTO)	method:%(method)	status:%(status)	user:%(user)	host:%(host)	path:%(var.PATH_INFO)	path_pattern:%(re_path)	query:%(var.QUERY_STRING)	referer:%(referer)	taken_time_us:%(micros)	req_body_bytes:%(cl)	res_bytes:%(size)	res_body_bytes:%(rsize)	app_worker:%(wid)	accept_language:%(var.HTTP_ACCEPT_LANGUAGE)	user_agent:%(uagent)	app_version:$(APP_VERSION)	logger:access
log-date=%%Y-%%m-%%dT%%H:%%M:%%S%%z
logfile-chmod=644
