name: Security scan

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks / dependency-review / semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install gitleaks
        env:
          # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks
          GITLEAKS_VERSION: "v8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -O "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -zxf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Check secrets
        run: |
          "$RUNNER_TEMP/gitleaks" dir -v --config .github/gitleaks.toml "."

      - name: Dependency Review
        if: ${{ github.event_name == 'pull_request' && vars.GHAS_DISABLED != 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # frontend ディレクトリを追加した場合はスキャン対象に加えること
      - name: Semgrep scan
        env:
          # renovate: datasource=docker depName=semgrep/semgrep
          SEMGREP_IMAGE: "semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942"
        run: |
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --error --oss-only reno_test_1
